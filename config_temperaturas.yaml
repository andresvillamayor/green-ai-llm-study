    # documentales y NO se aplicaron en la campana.
    llama-2-7b:
      temperature: null
      nota: "No aplica - Llama-2-7B es modelo BASE, sin recomendación 
             oficial de temperatura de uso conversacional por parte de 
             Meta. Confirmado: TheBloke declara 'Prompt template: None'; 
             Meta describe el repo como 'the pretrained model'; metadata 
             GGUF sin campos de chat template."
    llama-2-7b-chat:
      temperature: 0.6
      top_p: 0.9
      fuente: "Script de ejemplo de Meta (example_chat_completion.py): temperature 0.6, top_p 0.9. No se usa el generation_config.json de Hugging Face: hay reportes de que sus valores aparecen intercambiados."
    qwen2.5-7b:
      temperature: 0.7
      top_p: 0.8
      top_k: 20  # pendiente de verificar contra generation_config.json
      repetition_penalty: 1.05
      fuente: "Documentacion oficial de Qwen2.5 (temperature 0.7, top_p 0.8, repetition_penalty 1.05); top_k 20 pendiente de verificar contra generation_config.json"